<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Public+Sans:wght@400;500;600\&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"><title>My rides – Smart Ride</title></head><body>
<div id="bar"></div>
<main class="container py-4">
<ul class="nav nav-pills mb-3 flex-wrap gap-1">
 <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#home">My ride</button></li>
 <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#plans">Plans</button></li>
 <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#billing">Payments &amp; invoices</button></li>
 <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#alerts">Notifications <span id="badge" class="badge badge-dot d-none"></span></button></li>
 <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#support">Support</button></li>
 <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#profile">Profile</button></li>
</ul>
<div class="tab-content">
 <div class="tab-pane fade show active" id="home"></div>
 <div class="tab-pane fade" id="plans"></div>
 <div class="tab-pane fade" id="billing"></div>
 <div class="tab-pane fade" id="alerts"></div>
 <div class="tab-pane fade" id="support"></div>
 <div class="tab-pane fade" id="profile"></div>
</div></main>

<div class="modal fade" id="subModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content" onsubmit="return createSub(event)">
 <div class="modal-header"><h5 class="modal-title" id="subTitle">Your route</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
 <div class="modal-body"><input type="hidden" id="subPlan">
  <label class="form-label">Pickup location</label><input class="form-control mb-3" id="subPickup" required placeholder="House number, area, city">
  <label class="form-label">Drop location</label><input class="form-control mb-3" id="subDrop" required placeholder="Office or college address">
  <div class="row"><div class="col"><label class="form-label">Morning pickup time</label><input type="time" class="form-control" id="subPT" value="09:00" required></div>
  <div class="col"><label class="form-label">Evening drop time</label><input type="time" class="form-control" id="subDT" value="18:00" required></div></div></div>
 <div class="modal-footer"><button class="btn btn-green">Continue to payment</button></div></form></div></div>

<div class="modal fade" id="payModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
 <div class="modal-header"><h5 class="modal-title">Pay for your plan</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
 <div class="modal-body"><p class="fs-4 mb-1" id="payAmt"></p><p class="muted" id="payPlan"></p>
  <label class="form-label">Payment method</label><select class="form-select" id="payMethod"><option>UPI</option><option>Credit / debit card</option><option>Net banking</option><option>Wallet</option></select>
  <p class="small muted mt-3 mb-0">Demo gateway: payment succeeds instantly. Razorpay or Stripe plugs in at <code>server/routes/user.js</code>.</p></div>
 <div class="modal-footer"><button class="btn btn-sr" onclick="pay()">Pay now</button></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/common.js"></script><script src="/js/user.js"></script></body></html>
